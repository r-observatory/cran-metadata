name: Update CRAN Metadata

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      start_fresh:
        description: "Discard a prior metadata.db that fails validation and start over (its carried history is lost)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: cran-metadata-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::RSQLite
            any::DBI
            any::jsonlite
            any::testthat
            any::withr
            any::yaml

      - name: Run unit tests
        run: Rscript tests/testthat.R

      - name: Download previous database
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # gh runs only in plain assignments or bare commands, so an API error
          # fails the job instead of reading as no release or no manifest.
          releases="$(gh release list --limit 1 --exclude-drafts)"
          if [ -n "$releases" ]; then
            # The db, its manifest and prior-tag.txt all come from this one tag.
            tag="$(gh release view --json tagName --jq .tagName)"
            gh release download "$tag" --pattern "metadata.db"
            assets="$(gh release view "$tag" --json assets --jq '.assets[].name')"
            if grep -qx "manifest.json" <<<"$assets"; then
              gh release download "$tag" --pattern "manifest.json" --output prior-manifest.json
            fi
            printf '%s\n' "$tag" > prior-tag.txt
          else
            echo "No prior release exists yet; first run, starting fresh."
          fi

      - name: Validate downloaded database
        if: hashFiles('metadata.db') != ''
        env:
          START_FRESH: ${{ inputs.start_fresh }}
        run: Rscript scripts/validate_prior.R metadata.db prior-manifest.json

      - name: Run update script
        run: Rscript scripts/update.R metadata.db

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(date -u +'%Y%m%d-%H%M%S')"
          gh release create "$TAG" metadata.db manifest.json \
            --title "CRAN Metadata $TAG" \
            --notes-file release_notes.md \
            --latest

      - name: Update last run timestamp
        continue-on-error: true
        run: |
          echo "Last updated: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" > last-updated.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last-updated.txt
          git diff --cached --quiet || git commit -m "chore: update last run time"
          git pull --rebase || true
          git push
