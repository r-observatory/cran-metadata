name: Update CRAN Metadata

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cran-metadata-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::RSQLite
            any::DBI
            any::jsonlite
            any::testthat
            any::withr

      - name: Run unit tests
        run: Rscript tests/testthat.R

      - name: Download previous database
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # A prior release is authoritative. Downloading it must succeed, or the
          # run must fail: cold-starting would re-baseline cran_check_deadlines
          # first_seen/episode_seq (unlike the rebuild-tolerant check_status_history).
          # Distinguish that from a genuine first run, where no release exists yet.
          if gh release view --json tagName >/dev/null 2>&1; then
            gh release download --pattern "metadata.db"
          else
            echo "No prior release exists yet; legitimate bootstrap, starting fresh."
          fi

      - name: Validate downloaded database
        if: hashFiles('metadata.db') != ''
        run: |
          # Test if update.R can actually open and use this DB.
          # RSQLite crashes on NUL bytes in TEXT columns. All metadata tables
          # are rebuilt each run, so starting fresh is safe (one-time loss of
          # check_status_history is acceptable).
          Rscript -e '
            library(RSQLite)
            con <- dbConnect(SQLite(), "metadata.db")
            tryCatch({
              dbExecute(con, "CREATE TABLE IF NOT EXISTS check_status_history (
                id INTEGER PRIMARY KEY AUTOINCREMENT,
                package TEXT NOT NULL, status TEXT NOT NULL,
                flavor_summary TEXT, details TEXT, detected_at TEXT NOT NULL)")
              dbGetQuery(con, "SELECT COUNT(*) FROM check_status_history")
              dbExecute(con, "CREATE TABLE IF NOT EXISTS cran_check_deadlines (
                package TEXT NOT NULL, episode_seq INTEGER NOT NULL, deadline TEXT NOT NULL,
                version TEXT, worst_status TEXT, first_seen TEXT NOT NULL, last_seen TEXT NOT NULL,
                resolved_on TEXT, outcome TEXT, archived_on TEXT,
                PRIMARY KEY (package, episode_seq))")
              dbGetQuery(con, "SELECT COUNT(*) FROM cran_check_deadlines")
              cat("Database OK\n")
            }, error = function(e) {
              cat("Database corrupted:", conditionMessage(e), "\n")
              dbDisconnect(con)
              file.remove("metadata.db")
              cat("Removed — will start fresh\n")
            })
            if (file.exists("metadata.db")) dbDisconnect(con)
          '

      - name: Run update script
        run: Rscript scripts/update.R metadata.db

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(date -u +'%Y%m%d-%H%M%S')"
          gh release create "$TAG" metadata.db manifest.json \
            --title "CRAN Metadata $TAG" \
            --notes-file release_notes.md \
            --latest

      - name: Update last run timestamp
        continue-on-error: true
        run: |
          echo "Last updated: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" > last-updated.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last-updated.txt
          git diff --cached --quiet || git commit -m "chore: update last run time"
          git pull --rebase || true
          git push
